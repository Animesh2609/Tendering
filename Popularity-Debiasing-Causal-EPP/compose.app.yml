services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recommendations
      POSTGRES_USER: recommender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recommendation_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommender -d recommendations"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  recommendation_db:
