<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" />
    <meta name="description" content="TenderBlock brings a clearer, more accountable tendering experience to public institutions and businesses." />
    <title>TenderBlock — Procurement, connected</title>
    <script>
    try {
      const saved = localStorage.getItem('tenderblock_color_theme');
      const theme = saved === 'light' ? 'light' : 'dark';
      if (theme === 'dark') document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = theme;
    } catch { document.documentElement.classList.add('dark'); }
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
